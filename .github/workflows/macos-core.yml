name: macOS core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Swift source syntax
        run: xcrun swiftc -frontend -parse Sources/Keyboop/*.swift
      - name: Build destination safety
        run: ./script/test-build-destination.sh
      - name: Voice history transaction
        run: ./script/test-voice-history.sh
      - name: Clipboard export and tracked input
        run: ./script/test-clipboard-transfer.sh
      - name: Verify retired feature dependencies
        run: |
          if git grep -n -E 'ClipboardWatcher|PasteQueueSystem|PlainPaste\.paste|TranslationEngine|convertSelection\(' -- 'Sources/Keyboop/*.swift'; then
            exit 1
          fi
